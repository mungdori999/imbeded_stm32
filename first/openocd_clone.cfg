# =============================================================
#  클론 STM32F103C8 범용 OpenOCD 설정 (강의/학생 배포용)
#
#  - 정품 검증이나 ST 스크립트(st_scripts)에 전혀 의존하지 않음
#  - hla 드라이버(무한 재귀 문제) 대신 최신 st-link(dapdirect) 사용
#  - -expected-id 를 두지 않아 어떤 클론이든(DPIDR 값 상관없이) 접속
#
#  사용: run_openocd 실행 스크립트(Windows: run_openocd.bat / macOS: run_openocd.command)가
#        이 파일을 자동으로 물려서 실행합니다. (실행 스크립트와 같은 폴더에 두세요)
# =============================================================

adapter driver st-link
st-link vid_pid 0x0483 0x3748 0x0483 0x374b 0x0483 0x374d 0x0483 0x374e 0x0483 0x374f 0x0483 0x3752 0x0483 0x3753 0x0483 0x3754 0x0483 0x3755 0x0483 0x3757

transport select dapdirect_swd

set _CHIPNAME stm32f103c8
set _ENDIAN   little

swd newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

$_CHIPNAME.cpu configure -work-area-phys 0x20000000 -work-area-size 0x5000 -work-area-backup 0
flash bank $_CHIPNAME.flash stm32f1x 0x08000000 0 0 0 $_CHIPNAME.cpu

reset_config srst_only srst_nogate
adapter speed 1000

gdb_port 3333
